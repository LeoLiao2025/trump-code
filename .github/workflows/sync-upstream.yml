# ===================================================================
# 上游同步偵測 — 自動檢查 sstklen/trump-code 有無更新
# 每天 UTC 06:00 執行
# 有新 commit → 自動開 PR + 發 Discord 通知
# 沒有更新 → 靜默跳過
# ===================================================================

name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/sstklen/trump-code.git
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          # 計算上游比 fork 多幾個 commit
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT

          if [ "$BEHIND" -gt "0" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT

            # 收集新 commit 資訊（最多顯示 10 條）
            COMMITS=$(git log HEAD..upstream/main --oneline --no-merges | head -10)
            # 用 base64 避免換行符號破壞 output
            COMMITS_B64=$(echo "$COMMITS" | base64 -w 0)
            echo "commits_b64=$COMMITS_B64" >> $GITHUB_OUTPUT

            LATEST=$(git log upstream/main -1 --format="%s (%ad)" --date=short)
            echo "latest=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch and PR
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH="sync/upstream-$(date -u +%Y%m%d)"

          # 如果 branch 已存在就跳過（今天已經開過 PR）
          if git ls-remote --exit-code origin "$BRANCH"; then
            echo "Branch $BRANCH already exists, skipping PR creation."
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config merge.ours.driver true

          git checkout -b "$BRANCH"

          # 嘗試合併；衝突時對 data/ 自動保留我們的版本
          if ! git merge upstream/main --no-edit --allow-unrelated-histories; then
            echo "Merge conflicts detected, resolving data files with ours..."
            git checkout --ours -- data/
            git add data/
            git commit --no-edit -m "merge: sync upstream (resolve data conflicts with ours)"
          fi

          # 若 tree 內容與 main 完全相同（上游只改了 data/，ours 保留），跳過推送與 PR
          if git diff --quiet origin/main "$BRANCH"; then
            echo "No effective changes vs main (data-only upstream update, kept ours). Skipping PR."
            exit 0
          fi

          git push origin "$BRANCH"

          # 輪詢確認 branch 已被 GitHub API 索引（最多等 120 秒）
          echo "Waiting for GitHub to index branch '$BRANCH'..."
          AHEAD=0
          for attempt in $(seq 1 12); do
            AHEAD=$(gh api "repos/${{ github.repository }}/compare/main...$BRANCH" \
              --jq '.ahead_by' 2>/dev/null || echo "0")
            if [ "$AHEAD" -gt "0" ]; then
              echo "Branch indexed after attempt $attempt ($AHEAD commits ahead of main)"
              break
            fi
            echo "Attempt $attempt/12: not ready yet, sleeping 10s..."
            sleep 10
          done

          if [ "$AHEAD" -eq "0" ]; then
            echo "WARNING: Branch still not indexed after 120s, attempting PR creation anyway..."
          fi

          BEHIND=${{ steps.check.outputs.behind }}
          COMMITS=$(echo "${{ steps.check.outputs.commits_b64 }}" | base64 -d)
          LATEST="${{ steps.check.outputs.latest }}"

          cat > /tmp/pr_body.md <<EOF
          ## 上游同步

          **新 commit 數：** ${BEHIND} 個
          **最新：** ${LATEST}

          ### Commit 列表
          \`\`\`
          ${COMMITS}
          \`\`\`

          ### 處理方式
          - ✅ **直接 Merge** — 接受上游所有更新
          - 🔍 **逐一審查** — 查看 Files changed 後決定

          > 此 PR 由 GitHub Actions 自動建立
          EOF

          # 用 REST API 建立 PR（避免 GraphQL 索引延遲導致 "Head sha can't be blank" 錯誤）
          PR_BODY=$(cat /tmp/pr_body.md)
          jq -n \
            --arg title "⬆️ 上游更新：sstklen/trump-code 有 ${BEHIND} 個新 commit" \
            --arg body "$PR_BODY" \
            --arg head "$BRANCH" \
            --arg base "main" \
            '{title: $title, body: $body, head: $head, base: $base}' \
            | gh api "repos/${{ github.repository }}/pulls" --method POST --input -

      - name: Send Discord notification
        if: steps.check.outputs.has_updates == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          BEHIND=${{ steps.check.outputs.behind }}
          COMMITS=$(echo "${{ steps.check.outputs.commits_b64 }}" | base64 -d)
          LATEST="${{ steps.check.outputs.latest }}"
          REPO="${{ github.repository }}"
          PR_URL="https://github.com/${REPO}/pulls"

          # 組成 Discord embed 訊息
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "⬆️ 川普密碼｜上游有新更新",
              "color": 3447003,
              "fields": [
                {
                  "name": "新 commit 數",
                  "value": "${BEHIND} 個",
                  "inline": true
                },
                {
                  "name": "最新 commit",
                  "value": "${LATEST}",
                  "inline": true
                },
                {
                  "name": "Commit 列表",
                  "value": "\`\`\`${COMMITS}\`\`\`",
                  "inline": false
                },
                {
                  "name": "查看 PR",
                  "value": "${PR_URL}",
                  "inline": false
                }
              ],
              "footer": {
                "text": "sstklen/trump-code → LeoLiao2025/trump-code"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: No updates notice
        if: steps.check.outputs.has_updates == 'false'
        run: echo "✅ 上游無新更新，跳過。"
